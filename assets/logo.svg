<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" width="100%" height="100%">
  <defs>
    <!-- Icon background -->
    <radialGradient id="l-bg" cx="125" cy="130" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0d1a12"/>
      <stop offset="60%"  stop-color="#080e0b"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Frame gradient -->
    <linearGradient id="l-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f97316"/>
      <stop offset="50%"  stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Hub gradient -->
    <radialGradient id="l-hub" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="50%"  stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>

    <radialGradient id="l-or" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
    <radialGradient id="l-em" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <radialGradient id="l-vi" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>

    <!-- Text gradient -->
    <linearGradient id="l-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Accent text gradient -->
    <linearGradient id="l-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#fb923c"/>
      <stop offset="50%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="l-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Hub glow -->
    <filter id="l-hub-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ═══════════════════════════════
       LEFT EMBLEM ICON  (260×260 box)
       ═══════════════════════════════ -->
  <g transform="translate(15, 15)">
    <!-- Background square -->
    <rect width="230" height="230" rx="52" fill="url(#l-bg)" stroke="#1a2e1e" stroke-width="1.5"/>

    <!-- Scaled octagon (scale 230/512 ≈ 0.449, centre 115,115) -->
    <!-- Original octagon pts at r=215: scale by 0.449 → r≈96.5
         0°→(211,115) 45°→(183,183) 90°→(115,211) 135°→(47,183)
         180°→(19,115) 225°→(47,47) 270°→(115,19) 315°→(183,47) -->
    <polygon
      points="211,115 183,183 115,211 47,183 19,115 47,47 115,19 183,47"
      fill="none" stroke="url(#l-frame)" stroke-width="2.2"
      stroke-linejoin="round" opacity="0.9" filter="url(#l-glow)"/>

    <!-- Vertex dots -->
    <circle cx="211" cy="115" r="2.8" fill="#f97316"/>
    <circle cx="183" cy="183" r="2.8" fill="#fb923c"/>
    <circle cx="115" cy="211" r="2.8" fill="#10b981"/>
    <circle cx="47"  cy="183" r="2.8" fill="#34d399"/>
    <circle cx="19"  cy="115" r="2.8" fill="#8b5cf6"/>
    <circle cx="47"  cy="47"  r="2.8" fill="#a78bfa"/>
    <circle cx="115" cy="19"  r="2.8" fill="#f97316"/>
    <circle cx="183" cy="47"  r="2.8" fill="#10b981"/>

    <!-- Inner dashed ring -->
    <circle cx="115" cy="115" r="83" fill="none" stroke="#1e3a2a" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.6"/>

    <!-- Outer 6 nodes (r=65): 0°→(180,115) 60°→(147,171) 120°→(82,171)
         180°→(50,115) 240°→(82,59) 300°→(147,59) -->
    <!-- Network edges outer→centre -->
    <g stroke="#10b981" stroke-width="1.2" opacity="0.55">
      <line x1="180" y1="115" x2="115" y2="115"/>
      <line x1="148" y1="171" x2="115" y2="115"/>
      <line x1="82"  y1="171" x2="115" y2="115"/>
      <line x1="50"  y1="115" x2="115" y2="115"/>
      <line x1="82"  y1="59"  x2="115" y2="115"/>
      <line x1="148" y1="59"  x2="115" y2="115"/>
    </g>
    <!-- Outer hex loop -->
    <g stroke="#8b5cf6" stroke-width="0.9" opacity="0.45">
      <line x1="180" y1="115" x2="148" y2="171"/>
      <line x1="148" y1="171" x2="82"  y2="171"/>
      <line x1="82"  y1="171" x2="50"  y2="115"/>
      <line x1="50"  y1="115" x2="82"  y2="59"/>
      <line x1="82"  y1="59"  x2="148" y2="59"/>
      <line x1="148" y1="59"  x2="180" y2="115"/>
    </g>
    <!-- Orange cross-diagonals -->
    <g stroke="#f97316" stroke-width="0.8" opacity="0.3">
      <line x1="180" y1="115" x2="82"  y2="171"/>
      <line x1="148" y1="59"  x2="82"  y2="171"/>
    </g>

    <!-- Outer 6 network nodes -->
    <circle cx="180" cy="115" r="6"   fill="url(#l-or)" filter="url(#l-glow)"/>
    <circle cx="148" cy="171" r="6"   fill="url(#l-em)" filter="url(#l-glow)"/>
    <circle cx="82"  cy="171" r="6"   fill="url(#l-vi)" filter="url(#l-glow)"/>
    <circle cx="50"  cy="115" r="6"   fill="url(#l-or)" filter="url(#l-glow)"/>
    <circle cx="82"  cy="59"  r="6"   fill="url(#l-em)" filter="url(#l-glow)"/>
    <circle cx="148" cy="59"  r="6"   fill="url(#l-vi)" filter="url(#l-glow)"/>

    <!-- Hub node -->
    <circle cx="115" cy="115" r="24" fill="#f97316" opacity="0.12" filter="url(#l-hub-glow)"/>
    <circle cx="115" cy="115" r="14" fill="url(#l-hub)" filter="url(#l-hub-glow)"/>
    <circle cx="115" cy="115" r="14" fill="url(#l-hub)"/>
    <circle cx="110" cy="110" r="5"  fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- ═══════════════════════════════
       RIGHT WORDMARK TEXT
       ═══════════════════════════════ -->
  <g transform="translate(268, 0)">
    <!-- Primary brand name -->
    <text
      x="0" y="108"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
      font-size="72"
      font-weight="800"
      letter-spacing="-1"
      fill="url(#l-text)">Suleiman</text>

    <!-- Accent name -->
    <text
      x="0" y="185"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
      font-size="62"
      font-weight="800"
      letter-spacing="-0.5"
      fill="url(#l-accent)">BioinformaticsAnalysis</text>

    <!-- Tagline -->
    <text
      x="3" y="222"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
      font-size="22"
      font-weight="400"
      letter-spacing="2.5"
      fill="#64748b">MULTI-OMICS  ·  AI STRUCTURAL BIOLOGY  ·  ONCOLOGY</text>
  </g>
</svg>
