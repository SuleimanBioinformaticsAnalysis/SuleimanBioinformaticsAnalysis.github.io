<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep dark background -->
    <radialGradient id="sba-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1a12"/>
      <stop offset="55%" stop-color="#080e0b"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Octagon frame gradient: orange → violet → emerald -->
    <linearGradient id="sba-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f97316"/>
      <stop offset="35%"  stop-color="#fb923c"/>
      <stop offset="60%"  stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Hub center gradient -->
    <radialGradient id="sba-hub" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="45%"  stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>

    <!-- Orange node -->
    <radialGradient id="sba-orange" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>

    <!-- Emerald node -->
    <radialGradient id="sba-emerald" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>

    <!-- Violet node -->
    <radialGradient id="sba-violet" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>

    <!-- Soft glow filter -->
    <filter id="sba-soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Network edge glow -->
    <filter id="sba-edge" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Hub strong glow -->
    <filter id="sba-hub-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="b1"/>
      <feGaussianBlur stdDeviation="9"  result="b2"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Background atmosphere glow -->
    <filter id="sba-atm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- ── Background ── -->
  <rect width="512" height="512" rx="108" fill="url(#sba-bg)"/>

  <!-- ── Atmospheric center glow (deep orange pulse) ── -->
  <circle cx="256" cy="256" r="130" fill="#f97316" opacity="0.07" filter="url(#sba-atm)"/>
  <circle cx="256" cy="256" r="90"  fill="#10b981" opacity="0.05" filter="url(#sba-atm)"/>

  <!-- ── Outer octagon frame ── -->
  <!-- Points at r=215, angles: 0°,45°,90°,135°,180°,225°,270°,315° -->
  <polygon
    points="471,256 408,408 256,471 104,408 41,256 104,104 256,41 408,104"
    fill="none"
    stroke="url(#sba-frame)"
    stroke-width="4"
    stroke-linejoin="round"
    opacity="0.92"
    filter="url(#sba-soft)"/>

  <!-- Octagon vertex accent nodes -->
  <circle cx="471" cy="256" r="5.5" fill="#f97316" filter="url(#sba-soft)"/>
  <circle cx="408" cy="408" r="5.5" fill="#fb923c" filter="url(#sba-soft)"/>
  <circle cx="256" cy="471" r="5.5" fill="#10b981" filter="url(#sba-soft)"/>
  <circle cx="104" cy="408" r="5.5" fill="#34d399" filter="url(#sba-soft)"/>
  <circle cx="41"  cy="256" r="5.5" fill="#8b5cf6" filter="url(#sba-soft)"/>
  <circle cx="104" cy="104" r="5.5" fill="#a78bfa" filter="url(#sba-soft)"/>
  <circle cx="256" cy="41"  r="5.5" fill="#f97316" filter="url(#sba-soft)"/>
  <circle cx="408" cy="104" r="5.5" fill="#10b981" filter="url(#sba-soft)"/>

  <!-- ── Inner dashed orbital ring ── -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#1e3a2a" stroke-width="1.2" stroke-dasharray="5 9" opacity="0.55"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#2d1f4e" stroke-width="1"   stroke-dasharray="3 7" opacity="0.45"/>

  <!-- ════════════════════════════════════════
       CO-EXPRESSION NETWORK GRAPH
       Outer nodes  (r=145): 6 nodes at 0°,60°,120°,180°,240°,300°
       Inner nodes  (r=82):  6 nodes at 30°,90°,150°,210°,270°,330°
       Centre hub   at (256,256)
       ════════════════════════════════════════ -->

  <!-- Outer ring positions (r=145):
       0°   → (401, 256)
       60°  → (256+72.5=328, 256+125.6=382)  ≈ (329, 382)
       120° → (256-72.5=184, 256+125.6=382)  ≈ (184, 382)
       180° → (111, 256)
       240° → (184, 130)
       300° → (329, 130)
  -->

  <!-- Inner ring positions (r=82):
       30°  → (256+71=327, 256+41=297)
       90°  → (256, 338)
       150° → (256-71=185, 297)
       210° → (185, 215)
       270° → (256, 174)
       330° → (327, 215)
  -->

  <!-- ── Outer→Inner edges (orange, dim) ── -->
  <g stroke="#f97316" stroke-width="1.8" opacity="0.38" filter="url(#sba-edge)">
    <line x1="401" y1="256" x2="327" y2="297"/>
    <line x1="401" y1="256" x2="327" y2="215"/>
    <line x1="329" y1="382" x2="327" y2="297"/>
    <line x1="329" y1="382" x2="256" y2="338"/>
    <line x1="184" y1="382" x2="256" y2="338"/>
    <line x1="184" y1="382" x2="185" y2="297"/>
    <line x1="111" y1="256" x2="185" y2="297"/>
    <line x1="111" y1="256" x2="185" y2="215"/>
    <line x1="184" y1="130" x2="185" y2="215"/>
    <line x1="184" y1="130" x2="256" y2="174"/>
    <line x1="329" y1="130" x2="256" y2="174"/>
    <line x1="329" y1="130" x2="327" y2="215"/>
    <!-- Long diagonals across outer ring -->
    <line x1="401" y1="256" x2="184" y2="382" stroke-width="1" opacity="0.4"/>
    <line x1="329" y1="130" x2="184" y2="382" stroke-width="1" opacity="0.3"/>
    <line x1="329" y1="382" x2="184" y2="130" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- ── Inner→Centre edges (emerald, brighter) ── -->
  <g stroke="#10b981" stroke-width="2.2" opacity="0.65" filter="url(#sba-edge)">
    <line x1="327" y1="297" x2="256" y2="256"/>
    <line x1="256" y1="338" x2="256" y2="256"/>
    <line x1="185" y1="297" x2="256" y2="256"/>
    <line x1="185" y1="215" x2="256" y2="256"/>
    <line x1="256" y1="174" x2="256" y2="256"/>
    <line x1="327" y1="215" x2="256" y2="256"/>
  </g>

  <!-- ── Inner ring hexagonal loop edges (violet) ── -->
  <g stroke="#8b5cf6" stroke-width="1.6" opacity="0.5" filter="url(#sba-edge)">
    <line x1="327" y1="297" x2="256" y2="338"/>
    <line x1="256" y1="338" x2="185" y2="297"/>
    <line x1="185" y1="297" x2="185" y2="215"/>
    <line x1="185" y1="215" x2="256" y2="174"/>
    <line x1="256" y1="174" x2="327" y2="215"/>
    <line x1="327" y1="215" x2="327" y2="297"/>
  </g>

  <!-- ── Outer network nodes (r=145), alternating orange/emerald/violet ── -->
  <circle cx="401" cy="256" r="11" fill="url(#sba-orange)"  filter="url(#sba-soft)"/>
  <circle cx="329" cy="382" r="11" fill="url(#sba-emerald)" filter="url(#sba-soft)"/>
  <circle cx="184" cy="382" r="11" fill="url(#sba-violet)"  filter="url(#sba-soft)"/>
  <circle cx="111" cy="256" r="11" fill="url(#sba-orange)"  filter="url(#sba-soft)"/>
  <circle cx="184" cy="130" r="11" fill="url(#sba-emerald)" filter="url(#sba-soft)"/>
  <circle cx="329" cy="130" r="11" fill="url(#sba-violet)"  filter="url(#sba-soft)"/>

  <!-- Node inner highlight dots -->
  <circle cx="401" cy="252" r="3.5" fill="#fff8f0" opacity="0.7"/>
  <circle cx="329" cy="378" r="3.5" fill="#ecfdf5" opacity="0.7"/>
  <circle cx="184" cy="378" r="3.5" fill="#ede9fe" opacity="0.7"/>
  <circle cx="111" cy="252" r="3.5" fill="#fff8f0" opacity="0.7"/>
  <circle cx="184" cy="126" r="3.5" fill="#ecfdf5" opacity="0.7"/>
  <circle cx="329" cy="126" r="3.5" fill="#ede9fe" opacity="0.7"/>

  <!-- ── Inner network nodes (r=82), alternating colours ── -->
  <circle cx="327" cy="297" r="8" fill="url(#sba-emerald)" filter="url(#sba-soft)"/>
  <circle cx="256" cy="338" r="8" fill="url(#sba-orange)"  filter="url(#sba-soft)"/>
  <circle cx="185" cy="297" r="8" fill="url(#sba-violet)"  filter="url(#sba-soft)"/>
  <circle cx="185" cy="215" r="8" fill="url(#sba-emerald)" filter="url(#sba-soft)"/>
  <circle cx="256" cy="174" r="8" fill="url(#sba-orange)"  filter="url(#sba-soft)"/>
  <circle cx="327" cy="215" r="8" fill="url(#sba-violet)"  filter="url(#sba-soft)"/>

  <!-- ── Central Hub Node ── -->
  <!-- Halo rings -->
  <circle cx="256" cy="256" r="48" fill="#f97316" opacity="0.12" filter="url(#sba-hub-glow)"/>
  <circle cx="256" cy="256" r="32" fill="#f97316" opacity="0.2"  filter="url(#sba-soft)"/>
  <!-- Hub body -->
  <circle cx="256" cy="256" r="24" fill="url(#sba-hub)" filter="url(#sba-hub-glow)"/>
  <circle cx="256" cy="256" r="24" fill="url(#sba-hub)"/>
  <!-- Hub highlight -->
  <circle cx="249" cy="249" r="8" fill="#ffffff" opacity="0.88"/>
  <circle cx="249" cy="249" r="4" fill="#ffffff" opacity="0.55"/>
</svg>
