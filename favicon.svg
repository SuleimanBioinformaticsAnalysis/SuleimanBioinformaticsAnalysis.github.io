<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="fav-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#0d1a12"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="fav-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f97316"/>
      <stop offset="55%"  stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="fav-hub" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="50%"  stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>
    <radialGradient id="fav-em" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <radialGradient id="fav-or" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>
    <radialGradient id="fav-vi" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </radialGradient>
    <filter id="fav-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fav-hub-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="108" fill="url(#fav-bg)"/>

  <!-- Octagon frame -->
  <polygon
    points="471,256 408,408 256,471 104,408 41,256 104,104 256,41 408,104"
    fill="none" stroke="url(#fav-frame)" stroke-width="5"
    stroke-linejoin="round" opacity="0.9" filter="url(#fav-glow)"/>

  <!-- Outer nodes -->
  <circle cx="401" cy="256" r="14" fill="url(#fav-or)"  filter="url(#fav-glow)"/>
  <circle cx="329" cy="382" r="14" fill="url(#fav-em)"  filter="url(#fav-glow)"/>
  <circle cx="184" cy="382" r="14" fill="url(#fav-vi)"  filter="url(#fav-glow)"/>
  <circle cx="111" cy="256" r="14" fill="url(#fav-or)"  filter="url(#fav-glow)"/>
  <circle cx="184" cy="130" r="14" fill="url(#fav-em)"  filter="url(#fav-glow)"/>
  <circle cx="329" cy="130" r="14" fill="url(#fav-vi)"  filter="url(#fav-glow)"/>

  <!-- Edges outer→centre -->
  <g stroke="#10b981" stroke-width="2.5" opacity="0.55">
    <line x1="401" y1="256" x2="256" y2="256"/>
    <line x1="329" y1="382" x2="256" y2="256"/>
    <line x1="184" y1="382" x2="256" y2="256"/>
    <line x1="111" y1="256" x2="256" y2="256"/>
    <line x1="184" y1="130" x2="256" y2="256"/>
    <line x1="329" y1="130" x2="256" y2="256"/>
  </g>
  <!-- Outer hexagonal loop -->
  <g stroke="#8b5cf6" stroke-width="1.8" opacity="0.45">
    <line x1="401" y1="256" x2="329" y2="382"/>
    <line x1="329" y1="382" x2="184" y2="382"/>
    <line x1="184" y1="382" x2="111" y2="256"/>
    <line x1="111" y1="256" x2="184" y2="130"/>
    <line x1="184" y1="130" x2="329" y2="130"/>
    <line x1="329" y1="130" x2="401" y2="256"/>
  </g>

  <!-- Hub -->
  <circle cx="256" cy="256" r="50" fill="#f97316" opacity="0.1" filter="url(#fav-hub-glow)"/>
  <circle cx="256" cy="256" r="30" fill="url(#fav-hub)" filter="url(#fav-hub-glow)"/>
  <circle cx="256" cy="256" r="30" fill="url(#fav-hub)"/>
  <circle cx="248" cy="248" r="11" fill="#ffffff" opacity="0.9"/>
</svg>
